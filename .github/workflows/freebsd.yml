name: FreeBSD images

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      extra_packages:
        description: "Extra image packages, space-separated (e.g. vim git bash python3)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: freebsd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: freebsd-image (${{ matrix.machine }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        machine: [qemux86-64, qemuarm64]
    defaults:
      run:
        shell: bash
    env:
      MACHINE: ${{ matrix.machine }}
      CI_BUILD_DIR: ${{ github.workspace }}/builds/freebsd
      CI_ARTIFACTS: ${{ github.workspace }}/artifacts
      CI_SSTATE: ${{ github.workspace }}/sstate-cache
      CI_SSTATE_MIRROR: ${{ github.workspace }}/sstate-mirror
      CI_DOWNLOADS: ${{ github.workspace }}/downloads
      CI_BRANCH: ${{ github.base_ref || github.ref_name }}
      CI_CACHE_BRANCH: ${{ (github.base_ref || github.ref_name) == 'main-next' && 'main' || (github.base_ref || github.ref_name) }}
      OE_BRANCH: master

    steps:
      - name: Check out meta-bsd
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: meta-bsd
          persist-credentials: false

      - name: Prepare hosted runner
        run: bash meta-bsd/CI/prepare-runner.sh

      - name: Restore sstate
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CI_SSTATE }}
          key: sstate-v2-ubuntu24-${{ matrix.machine }}-${{ env.CI_CACHE_BRANCH }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sstate-v2-ubuntu24-${{ matrix.machine }}-${{ env.CI_CACHE_BRANCH }}-run-

      - name: Separate restored mirror from new sstate
        run: |
          # Restore and save use the same path to preserve Actions cache identity.
          mv "$CI_SSTATE" "$CI_SSTATE_MIRROR"
          mkdir "$CI_SSTATE"

      - name: Check out OE-Core and BitBake
        run: |
          git clone --depth 1 --branch "$OE_BRANCH" \
            https://git.openembedded.org/openembedded-core openembedded-core
          git clone --depth 1 --branch "$OE_BRANCH" \
            https://git.openembedded.org/bitbake bitbake
          mkdir -p "$CI_ARTIFACTS"
          {
            printf 'Machine: %s\nUpstream branch: %s\n' "$MACHINE" "$OE_BRANCH"
            for repository in meta-bsd openembedded-core bitbake; do
              printf '%s: ' "$repository"
              git -C "$repository" rev-parse HEAD
            done
          } | tee "$CI_ARTIFACTS/revisions.txt"

      - name: Configure BitBake
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages || '' }}
        run: |
          mkdir -p "$CI_BUILD_DIR"
          source openembedded-core/oe-init-build-env "$CI_BUILD_DIR"
          bitbake-layers add-layer "$GITHUB_WORKSPACE/meta-bsd"
          cat >> conf/local.conf <<EOF
          MACHINE = "$MACHINE"
          DISTRO = "freebsd"
          DL_DIR = "$CI_DOWNLOADS"
          SSTATE_DIR = "$CI_SSTATE"
          SSTATE_MIRRORS = "file://.* file://$CI_SSTATE_MIRROR/PATH"
          INHERIT += "rm_work"
          BB_DISKMON_DIRS = "STOPTASKS,\${TMPDIR},5G,100K HALT,\${TMPDIR},1G,1K"
          EOF
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          packages = os.environ["EXTRA_PACKAGES"].split()
          if any(not re.fullmatch(r"[a-z0-9][a-z0-9+.-]*", package) for package in packages):
              raise SystemExit("Extra packages must be package names containing lowercase letters, digits, '+', '.' or '-'.")
          if packages:
              with Path("conf/local.conf").open("a") as config:
                  config.write('IMAGE_INSTALL:append = " ' + " ".join(packages) + '"\n')
              print("Extra image packages: " + " ".join(packages))
          PY
          bitbake-layers show-layers

      - name: Build freebsd-image
        id: build
        timeout-minutes: 330
        run: |
          source openembedded-core/oe-init-build-env "$CI_BUILD_DIR"
          bitbake freebsd-image 2>&1 | tee "$CI_ARTIFACTS/bitbake.log"

      - name: Package images
        if: success()
        run: python3 meta-bsd/CI/artifacts.py images "$CI_BUILD_DIR" "$CI_ARTIFACTS" "$MACHINE"

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: freebsd-image-${{ matrix.machine }}
          path: ${{ env.CI_ARTIFACTS }}/freebsd-image-*.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Collect diagnostics
        if: ${{ always() && !cancelled() }}
        run: |
          python3 meta-bsd/CI/artifacts.py logs "$CI_BUILD_DIR" "$CI_ARTIFACTS" "$MACHINE"
          df -h

      - name: Upload diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: logs-${{ matrix.machine }}
          path: |
            ${{ env.CI_ARTIFACTS }}/revisions.txt
            ${{ env.CI_ARTIFACTS }}/bitbake.log
            ${{ env.CI_ARTIFACTS }}/diagnostics.tar.zst
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1

      - name: Make new sstate snapshot self-contained
        id: sstate-snapshot
        if: ${{ always() && !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') && github.event_name != 'pull_request' && env.CI_BRANCH != 'main-next' }}
        run: python3 meta-bsd/CI/artifacts.py sstate "$CI_SSTATE" "$CI_SSTATE_MIRROR"

      - name: Save sstate
        if: ${{ always() && !cancelled() && steps.sstate-snapshot.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CI_SSTATE }}
          key: sstate-v2-ubuntu24-${{ matrix.machine }}-${{ env.CI_CACHE_BRANCH }}-run-${{ github.run_id }}-${{ github.run_attempt }}
