DISTRO = "freebsd"
DISTRO_NAME = "FreeBSD bootstrap"
DISTRO_VERSION = "${FREEBSD_VERSION}"
BSD_OS_VARIANT ?= "FreeBSD@OpenEmbedded - meta-bsd"
BSD_OS_VARIANT_ID ?= "meta-bsd"
BSD_MOTD_MESSAGE ?= "FreeBSD@OpenEmbedded - meta-bsd"
TCLIBC = "freebsd"
INIT_MANAGER = "bsd"
PREFERRED_PROVIDER_virtual/kernel = "freebsd-base"
FILESYSTEM_PERMS_TABLES:class-target = "files/fs-perms-freebsd.txt"
TOOLCHAIN:class-target = "clang"
DISTRO_FEATURES = "ld-is-lld"
DISTRO_FEATURES_DEFAULTS = ""
DISTRO_FEATURES_NATIVE = ""
DISTRO_FEATURES_NATIVESDK = ""
INHERIT_DISTRO = "devshell sstate license buildstats bsd-siteinfo bsd-elf"
LLVM_TARGETS_TO_BUILD:pn-llvm-native = "X86"
# Upstream bootstrap code directly executes the external kill command.
HOSTTOOLS += "kill"
require conf/distro/include/freebsd-source.inc
require conf/distro/include/freebsd-qemu.inc
