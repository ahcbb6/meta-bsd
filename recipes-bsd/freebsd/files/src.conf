# Use the OE-provided toolchain and omit optional components from the base image,
# while enabling the host-side tools needed to create FreeBSD disk images.
WITHOUT_TOOLCHAIN=yes
WITHOUT_CLANG=yes
WITHOUT_LLD=yes
WITHOUT_LLDB=yes
WITHOUT_LIB32=yes
WITHOUT_TESTS=yes
WITHOUT_MAN=yes
WITHOUT_PROFILE=yes
WITHOUT_DEBUG_FILES=yes
WITHOUT_KERNEL_SYMBOLS=yes
WITHOUT_WERROR=yes
WITH_DISK_IMAGE_TOOLS_BOOTSTRAP=yes
WITHOUT_EXAMPLES=yes
